[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safegate_edge"
version = "0.1.0"
description = "SafeGate Edge is a local approval gateway for AI agents and automation workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
safegate = "safegate_edge.cli:main"
